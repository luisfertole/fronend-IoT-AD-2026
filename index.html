<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0909">
<title>Unidad 02 · Control IoT</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="css/estilos.css" rel="stylesheet">
</head>
<body>
<div class="app">
  <header class="top">
    <div class="titulo">
      <h1>Unidad <b>02</b></h1>
      <span id="veh">Vehículo IoT</span>
    </div>
    <div class="llave">
      <label for="clave" class="visually-hidden">Clave de la API (solo en memoria)</label>
      <input id="clave" type="password" autocomplete="off" placeholder="Clave API">
      <button id="guardar" type="button">Usar</button>
    </div>
  </header>

  <section class="inds" aria-label="Estado de conexiones">
    <div class="ind" id="ind-ws"><span class="ico"></span><span><small>WebSocket WSS</small><strong class="txt"></strong></span></div>
    <div class="ind" id="ind-api"><span class="ico"></span><span><small>AWS · API 21 servicios</small><strong class="txt"></strong></span></div>
    <div class="ind" id="ind-db"><span class="ico"></span><span><small>Amazon RDS</small><strong class="txt"></strong></span></div>
  </section>

  <main class="controls">
    <div class="joywrap">
      <div id="joy" tabindex="0" role="application" aria-label="Joystick. Flechas del teclado para mover; al soltar se detiene">
        <div id="knob"></div>
      </div>
    </div>
    <button id="detener" type="button">DETENER</button>
    <div id="botones" aria-label="Movimientos y funciones"></div>
  </main>

  <section class="demo" aria-label="Demostraciones">
    <label for="demo" class="visually-hidden">Selecciona una demostración</label>
    <select id="demo"></select>
    <button id="demo-run" type="button" class="b-ok">Ejecutar</button>
    <button id="demo-cancel" type="button" class="b-no">Cancelar</button>
  </section>

  <div id="mensaje" role="status" aria-live="polite">Listo.</div>
  <footer>Desarrollado por Luis Fernando Tolentino Segovia · 2026</footer>
</div>
<script type="module" src="js/main.js"></script>
</body>
</html>
